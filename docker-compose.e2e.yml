# E2E testing override - extends docker-compose.yml for test environments
services:
  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
    ports:
      - "8080:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:3000/health",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 15

  backend:
    environment:
      - NODE_ENV=test
      - JWT_SECRET=brainbytes-e2e-test-secret
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-placeholder-for-e2e}
      - MONGODB_URI=mongodb://mongo:27017/brainbytes
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 15

  mongo:
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongo --quiet"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 15

  e2e-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - CI=true
      - BASE_URL=http://frontend:3000
      - BACKEND_URL=http://backend:3000
    volumes:
      - ./frontend/e2e:/usr/src/app/e2e
      - ./frontend/playwright-report:/usr/src/app/playwright-report
