name: BrainBytes Lint

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      
      # Root ESLint deps (needed by eslint.config.mjs)
      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      # Frontend linting
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      
      - name: Lint frontend code
        run: npx eslint frontend/ || echo "Frontend linting failed but continuing workflow"
      
      # Backend linting
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Lint backend code
        run: npx eslint backend/ || echo "Backend linting failed but continuing workflow"

