name: BrainBytes CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # CODE QUALITY (lint + format + audit + secrets + large files)
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Cache & Install Frontend ──
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        id: cache-frontend-quality
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-node20-

      - name: Install root dependencies (for eslint.config.mjs)
        run: npm install --legacy-peer-deps

      - name: Install frontend dependencies
        if: steps.cache-frontend-quality.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm install --legacy-peer-deps --prefer-offline

      # ── Cache & Install Backend ──
      - name: Cache backend node_modules
        uses: actions/cache@v4
        id: cache-backend-quality
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-node20-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            backend-${{ runner.os }}-node20-

      - name: Install backend dependencies
        if: steps.cache-backend-quality.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: npm install --prefer-offline

      # ── ESLint ──
      - name: Lint frontend (ESLint)
        run: npx eslint frontend/

      - name: Lint backend (ESLint)
        run: npx eslint backend/

      # ── Prettier Format Check ──
      - name: Check frontend formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

      - name: Check backend formatting (Prettier)
        working-directory: ./backend
        run: npm run format:check

      # ── Dependency Vulnerability Audit ──
      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: |
          npm audit --json > /tmp/frontend-audit.json 2>&1 || true
          VULNS=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/frontend-audit.json', 'utf8'));
              const high = Object.values(data.vulnerabilities || {}).filter(v => v.severity === 'high' || v.severity === 'critical').length;
              console.log('HIGH_CRITICAL=' + high);
            } catch(e) { console.log('PARSE_ERROR=1'); }
          ")
          echo "$VULNS"
          if echo "$VULNS" | grep -q 'HIGH_CRITICAL=[1-9]'; then
            echo "::error::Frontend has high/critical vulnerabilities — review npm audit output"
            exit 1
          elif echo "$VULNS" | grep -q 'PARSE_ERROR=1'; then
            echo "::warning::Could not parse frontend npm audit output"
          else
            echo "::warning::Frontend npm audit completed (low/moderate vulnerabilities may exist)"
          fi

      - name: Audit backend dependencies
        working-directory: ./backend
        run: |
          npm audit --json > /tmp/backend-audit.json 2>&1 || true
          VULNS=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/backend-audit.json', 'utf8'));
              const high = Object.values(data.vulnerabilities || {}).filter(v => v.severity === 'high' || v.severity === 'critical').length;
              console.log('HIGH_CRITICAL=' + high);
            } catch(e) { console.log('PARSE_ERROR=1'); }
          ")
          echo "$VULNS"
          if echo "$VULNS" | grep -q 'HIGH_CRITICAL=[1-9]'; then
            echo "::error::Backend has high/critical vulnerabilities — review npm audit output"
            exit 1
          elif echo "$VULNS" | grep -q 'PARSE_ERROR=1'; then
            echo "::warning::Could not parse backend npm audit output"
          else
            echo "::warning::Backend npm audit completed (low/moderate vulnerabilities may exist)"
          fi

      # ── Secret Scanning (Gitleaks) ──
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # ── Large File Check ──
      - name: Check for large files (>5MB)
        run: |
          echo "Checking for files larger than 5MB..."
          LARGE_FILES=$(find . -type f \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.next/*' \
            -not -path '*/coverage/*' \
            -not -name '*.png' \
            -not -name '*.jpg' \
            -not -name '*.jpeg' \
            -not -name '*.gif' \
            -not -name '*.ico' \
            -not -name '*.svg' \
            -not -name '*.ttf' \
            -not -name '*.woff' \
            -not -name '*.woff2' \
            -not -name '*.eot' \
            -not -name 'package-lock.json' \
            -size +5M \
            -exec ls -lh {} \;)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Large files detected (over 5MB):"
            echo "$LARGE_FILES"
            echo "Please use Git LFS or reduce file sizes."
            exit 1
          else
            echo "No large files detected."
          fi

  # ─── CODEQL SAST ───
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ─── FRONTEND UNIT TESTS ──
  test-frontend:
    name: Frontend Tests (Node ${{ matrix.node-version }})
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend-node-${{ matrix.node-version }}
          path: frontend/coverage/junit.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-node-${{ matrix.node-version }}
          path: |
            frontend/coverage/
            !frontend/coverage/junit.xml
          retention-days: 7

  # ─── BACKEND UNIT TESTS ───
  test-backend:
    name: Backend Tests (Node ${{ matrix.node-version }})
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache backend node_modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            backend-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install backend dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: npm install --prefer-offline

      - name: Run backend tests
        working-directory: ./backend
        run: npm run test:ci

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-node-${{ matrix.node-version }}
          path: backend/coverage/junit.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-node-${{ matrix.node-version }}
          path: |
            backend/coverage/
            !backend/coverage/junit.xml
          retention-days: 7

  # E2E TESTS (Playwright)
  e2e:
    name: E2E Tests (Playwright)
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        id: cache-frontend-e2e
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-node20-

      - name: Install frontend dependencies
        if: steps.cache-frontend-e2e.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Start services with Docker Compose (E2E config)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml build --no-cache
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait --wait-timeout 120
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps

      - name: Debug Docker containers (on failure)
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
          echo "=== MongoDB Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs mongo
          echo "=== E2E Test Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs e2e-tests || true

      - name: Run E2E tests (via e2e-tests service)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e-tests

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Upload E2E JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: frontend/test-results/junit.xml
          retention-days: 7

      - name: Upload E2E screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 7

  # PERFORMANCE TESTS (k6)
  performance:
    name: Performance Tests (k6)
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'

      - name: Verify k6 installation
        run: k6 version

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.yml build --no-cache
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
          docker compose ps

      - name: Debug Docker containers (on failure)
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose ps -a
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo "=== MongoDB Logs ==="
          docker compose logs mongo

      - name: Run k6 performance tests
        run: k6 run backend/tests/performance/api-load-test.js --summary-export=backend/tests/performance/summary.json
        env:
          BASE_URL: http://localhost:3000

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            backend/tests/performance/summary.json
          retention-days: 7

  # BUILD DOCKER IMAGES
  build:
    name: Build Docker Images
    needs: [test-frontend, test-backend, e2e, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: brainbytes/frontend:latest
          cache-from: type=gha,scope=frontend-v3
          cache-to: type=gha,mode=max,scope=frontend-v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: brainbytes/backend:latest
          cache-from: type=gha,scope=backend-v3
          cache-to: type=gha,mode=max,scope=backend-v3

      # ── Container Vulnerability Scans (Trivy) ──
      - name: Scan frontend image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brainbytes/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0

      - name: Upload frontend scan results
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
        continue-on-error: true

      - name: Scan backend image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brainbytes/backend:latest
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0

      - name: Upload backend scan results
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
        continue-on-error: true

      - name: Test Docker Compose composition
        run: |
          docker compose -f docker-compose.yml build --no-cache
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
          docker compose ps
          bash test-composition.sh || echo "::warning::Composition test had issues"
          docker compose down

      - name: Debug Docker containers (on failure)
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose ps -a
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo "=== MongoDB Logs ==="
          docker compose logs mongo

  # TEST SUMMARY REPORT
  report:
    name: Generate Test Summary
    needs: [test-frontend, test-backend, e2e, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Download JUnit XMLs for merging and publishing
      - name: Download frontend JUnit (Node 20)
        uses: actions/download-artifact@v4
        with:
          name: junit-frontend-node-20
          path: test-results/junit/
        continue-on-error: true

      - name: Download backend JUnit (Node 20)
        uses: actions/download-artifact@v4
        with:
          name: junit-backend-node-20
          path: test-results/junit/
        continue-on-error: true

      - name: Download E2E JUnit
        uses: actions/download-artifact@v4
        with:
          name: junit-e2e
          path: test-results/junit/
        continue-on-error: true

      # Download coverage for summary
      - name: Download backend coverage (Node 20)
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend-node-20
          path: backend/coverage/
        continue-on-error: true

      - name: Download frontend coverage (Node 20)
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-node-20
          path: frontend/coverage/
        continue-on-error: true

      - name: Download E2E report
        uses: actions/download-artifact@v4
        with:
          name: e2e-playwright-report
          path: frontend/playwright-report/
        continue-on-error: true

      - name: Download performance results
        uses: actions/download-artifact@v4
        with:
          name: performance-test-results
          path: backend/tests/performance/
        continue-on-error: true

      - name: Generate test summary report
        run: node scripts/generate-summary.js

      # Publish merged JUnit results to GitHub Actions UI
      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results/junit/*.xml"
          comment_mode: off

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-report
          path: |
            test-results/summary.md
            test-results/summary.json
          retention-days: 30

      # ── PR Comment with Summary (only on PRs) ──
      - name: Find existing PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'BrainBytes Test Summary'

      - name: Post/Update PR comment with test summary
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: test-results/summary.md
          edit-mode: replace

  # NOTIFY
  notify:
    name: Notify Status
    needs: [code-quality, test-frontend, test-backend, e2e, performance, build, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Send email notification
        if: env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "BrainBytes CI/CD: ${{ job.status }} — ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          from: BrainBytes CI
          body: |
            Workflow: ${{ github.workflow }}
            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

