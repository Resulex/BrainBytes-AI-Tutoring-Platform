global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: brainbytes
    environment: production
    service: tutoring-platform

rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['localhost:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: prometheus
      - target_label: service
        replacement: prometheus

  - job_name: 'brainbytes-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    sample_limit: 1000
    label_limit: 30
    static_configs:
      - targets: ['backend:9080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend
      - target_label: app
        replacement: brainbytes
      - target_label: service
        replacement: backend

  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: node-exporter
      - target_label: service
        replacement: node-exporter

  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: cadvisor
      - target_label: service
        replacement: cadvisor
